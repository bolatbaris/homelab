name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n restore.sh
          bash -n backup-automount.sh
          bash -n run.sh
          sh -n backup/backup.sh
          sh -n backup/mattermost-db-dump.sh

      - name: ShellCheck (advisory)
        continue-on-error: true
        run: shellcheck install.sh restore.sh run.sh backup-automount.sh backup/backup.sh backup/mattermost-db-dump.sh

      - name: Validate Compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml --profile dns --profile mgmt --profile chat config >/dev/null
          docker compose -f docker-compose.yml -f compose.dev.yml --profile dns --profile mgmt --profile chat config >/dev/null

      - name: No auto-loaded override
        run: test ! -f docker-compose.override.yml

      - name: No unbounded port publishes
        run: |
          ! grep -nE '^[[:space:]]*-[[:space:]]*"?[0-9]+:[0-9]+' docker-compose.yml compose.dev.yml

      - name: systemd unit sanity
        run: |
          # systemd does not strip quotes from path-type directives; a leading
          # quote makes the path non-absolute, which is a fatal unit-file error
          # on systemd >= 253 ("has a bad unit file setting").
          if grep -nE "^[[:space:]]*(WorkingDirectory|RootDirectory|RootImage)=[\"']" \
               install.sh systemd/localcloud.service.example; then
            echo "quoted path directive in a systemd unit -- systemd will reject it"; exit 1
          fi

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- .; then
            echo "merge conflict markers found"; exit 1
          fi
