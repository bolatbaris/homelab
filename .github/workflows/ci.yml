name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n restore.sh
          bash -n backup-automount.sh
          bash -n run.sh
          bash -n tests/compose-guards.sh
          sh -n backup/backup.sh
          sh -n backup/mattermost-db-dump.sh

      - name: ShellCheck (advisory)
        continue-on-error: true
        run: shellcheck install.sh restore.sh run.sh backup-automount.sh
             tests/compose-guards.sh
             backup/backup.sh backup/mattermost-db-dump.sh

      - name: Validate Compose config
        run: |
          # The db profile binds ${TAILSCALE_IP} through compose's required-variable
          # form, so the render needs an address. Supplying a placeholder here is the
          # guard working as designed; tests/compose-guards.sh asserts the empty case
          # still fails.
          sed -E 's/^(TAILSCALE_IP)=.*/\1=100.64.0.1/' .env.example > .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml --profile dns --profile mgmt --profile chat --profile db config >/dev/null
          docker compose -f docker-compose.yml -f compose.dev.yml --profile dns --profile mgmt --profile chat --profile db config >/dev/null

      - name: No auto-loaded override
        run: test ! -f docker-compose.override.yml

      - name: Exposure guards
        run: ./tests/compose-guards.sh

      - name: systemd unit sanity
        run: |
          # systemd does not strip quotes from path-type directives; a leading
          # quote makes the path non-absolute, which is a fatal unit-file error
          # on systemd >= 253 ("has a bad unit file setting").
          if grep -nE "^[[:space:]]*(WorkingDirectory|RootDirectory|RootImage)=[\"']" \
               install.sh systemd/localcloud.service.example; then
            echo "quoted path directive in a systemd unit -- systemd will reject it"; exit 1
          fi

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- .; then
            echo "merge conflict markers found"; exit 1
          fi
