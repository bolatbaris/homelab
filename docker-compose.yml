version: "3.8"

services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-docker.io/cloudflare/cloudflared:latest}
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - edge-net

  portainer:
    image: ${PORTAINER_IMAGE:-docker.io/portainer/portainer-ce:latest}
    container_name: portainer
    profiles:
      - mgmt
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - ${PODMAN_SOCKET_PATH}:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - mgmt-net

  glances:
    image: ${GLANCES_IMAGE:-docker.io/nicolargo/glances:latest}
    container_name: glances
    restart: unless-stopped
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
      - ./data/monitor:/glances/conf:ro
    networks:
      - edge-net

  gitea:
    image: ${GITEA_IMAGE:-docker.io/gitea/gitea:latest}
    container_name: gitea
    restart: unless-stopped
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=https://${GITEA_SUBDOMAIN}.${BASE_DOMAIN}/
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-2222}
      - GITEA__server__SSH_DOMAIN=${BASE_DOMAIN}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
    volumes:
      - ./data/gitea:/data
    ports:
      - "${LAN_IP:-192.168.1.10}:${GITEA_SSH_PORT:-2222}:22"
    networks:
      - edge-net

  n8n:
    image: ${N8N_IMAGE:-docker.io/n8nio/n8n:latest}
    container_name: n8n
    restart: unless-stopped
    environment:
      - WEBHOOK_URL=https://${N8N_SUBDOMAIN}.${BASE_DOMAIN}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PUBLIC_API_DISABLED=true
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SECURITY_POLICY_MANAGED_BY_ENV=true
      - N8N_MFA_ENFORCED_ENABLED=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_SSRF_PROTECTION_ENABLED=true
      - N8N_SSRF_BLOCKED_IP_RANGES=default
      - N8N_COMMUNITY_PACKAGES_ENABLED=false
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile"]
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1000
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - edge-net

  adguard:
    image: ${ADGUARD_IMAGE:-docker.io/adguard/adguardhome:latest}
    container_name: adguard
    profiles:
      - dns
    restart: unless-stopped
    ports:
      - "${LAN_IP:-192.168.1.10}:53:53/tcp"
      - "${LAN_IP:-192.168.1.10}:53:53/udp"
      - "${LAN_IP:-192.168.1.10}:${ADGUARD_WEB_PORT:-3001}:80"
    volumes:
      - ./data/adguard/conf:/opt/adguardhome/conf
      - ./data/adguard/work:/opt/adguardhome/work
    networks:
      - dns-net

  mattermost:
    image: ${MATTERMOST_IMAGE:-docker.io/mattermost/mattermost-team-edition:release-10.5}
    container_name: mattermost
    profiles:
      - chat
    restart: unless-stopped
    # Plain ordering, not condition: service_healthy. Podman implements container
    # healthchecks as systemd user timers; when that timer cannot be created
    # (no user DBus session, for example) the health state stays "starting"
    # forever and a health-gated depends_on blocks `up -d` until the unit's
    # start timeout. Mattermost retries its database connection on startup and
    # `restart: unless-stopped` covers the rest, so ordering alone is enough.
    depends_on:
      - mattermost-postgres
    environment:
      - TZ=${TZ:-UTC}
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:${MATTERMOST_DB_PASSWORD}@mattermost-postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      - MM_SERVICESETTINGS_SITEURL=https://${MATTERMOST_SUBDOMAIN}.${BASE_DOMAIN}
      - MM_BLEVESETTINGS_INDEXDIR=/mattermost/bleve-indexes
      # --- security hardening ---
      - MM_TEAMSETTINGS_ENABLEOPENSERVER=false
      - MM_SERVICESETTINGS_ENABLEMULTIFACTORAUTHENTICATION=true
    volumes:
      - ./data/mattermost/config:/mattermost/config:rw
      - ./data/mattermost/data:/mattermost/data:rw
      - ./data/mattermost/logs:/mattermost/logs:rw
      - ./data/mattermost/plugins:/mattermost/plugins:rw
      - ./data/mattermost/client-plugins:/mattermost/client/plugins:rw
      - ./data/mattermost/bleve-indexes:/mattermost/bleve-indexes:rw
    networks:
      - edge-net
      - db-net
    # NO ports: in base - tunnel reaches it internally as http://mattermost:8065

  mattermost-postgres:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: mattermost-postgres
    profiles:
      - chat
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=${MATTERMOST_DB_PASSWORD}
      - POSTGRES_DB=mattermost
    volumes:
      - ./data/mattermost/postgres:/var/lib/postgresql/data
    # Kept for `podman ps` visibility and manual `podman healthcheck run`, but
    # deliberately not used to gate startup ordering - see mattermost above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net
    # NO ports: ever - database is internal-only, never exposed

  mattermost-postgres-dump:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: mattermost-postgres-dump
    profiles:
      - chat
    restart: unless-stopped
    # Same reasoning as mattermost above; the dump script already probes with
    # pg_isready and skips the run when the database is not reachable yet.
    depends_on:
      - mattermost-postgres
    command: ["/bin/sh", "/usr/local/bin/pg-dump.sh"]
    environment:
      - TZ=${TZ:-UTC}
      - PGHOST=mattermost-postgres
      - PGPORT=5432
      - PGUSER=mmuser
      - PGPASSWORD=${MATTERMOST_DB_PASSWORD}
      - PGDATABASE=mattermost
      # Single-database mode. With this prefix the filenames are byte-for-byte
      # what the old mattermost-db-dump.sh produced, so existing installs and
      # their restore instructions are unaffected.
      - DB_DUMP_ALL=false
      - DB_DUMP_PREFIX=mattermost
      - DB_DUMP_HOUR=${MATTERMOST_DB_DUMP_HOUR:-2}
      - DB_DUMP_MINUTE=${MATTERMOST_DB_DUMP_MINUTE:-45}
      - DB_DUMP_KEEP_DAYS=${MATTERMOST_DB_DUMP_KEEP_DAYS:-14}
    volumes:
      - ./backup/pg-dump.sh:/usr/local/bin/pg-dump.sh:ro
      - ./data/mattermost/db-dumps:/dumps
    networks:
      - db-net

  infisical:
    image: ${INFISICAL_IMAGE:-docker.io/infisical/infisical:latest}
    container_name: infisical
    profiles:
      - env
    restart: unless-stopped
    # Plain ordering, not condition: service_healthy - same Podman
    # healthcheck-as-systemd-user-timer lesson as mattermost above.
    depends_on:
      - infisical-postgres
      - infisical-redis
    environment:
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - DB_CONNECTION_URI=postgres://infisical:${INFISICAL_DB_PASSWORD}@infisical-postgres:5432/infisical?sslmode=disable
      # Hard requirement of the current Infisical image, not an optional
      # cache: startup validation refuses to run without it.
      - REDIS_URL=redis://infisical-redis:6379
      - SITE_URL=${INFISICAL_SITE_URL:-http://localhost:8080}
    ports:
      # Tier B (Private): reachable only through Tailscale. The loopback
      # fallback keeps an empty TAILSCALE_IP from degrading into a 0.0.0.0
      # bind; install.sh additionally fails closed when the env profile is
      # enabled without TAILSCALE_ENABLED=true.
      - "${TAILSCALE_IP:-127.0.0.1}:${INFISICAL_PORT:-8080}:8080"
    networks:
      - env-net
    # Deliberately NOT on edge-net: the tunnel must have no route to the
    # env store. See SECURITY.md Tier B.

  infisical-postgres:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: infisical-postgres
    profiles:
      - env
    restart: unless-stopped
    environment:
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
      - POSTGRES_DB=infisical
    volumes:
      - ./data/infisical/postgres:/var/lib/postgresql/data
    # Kept for `podman ps` visibility and manual `podman healthcheck run`,
    # deliberately not used to gate startup ordering - see mattermost above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - env-net
    # NO ports: ever - the env-store database is internal-only, never exposed

  infisical-redis:
    # Convention: stateful services are always per-feature and name-prefixed
    # (mattermost-postgres, infisical-postgres, infisical-redis). A future
    # service needing Redis gets its own instance (e.g. <app>-redis on its own
    # network), never this one - the same rule already applied to PostgreSQL.
    image: ${INFISICAL_REDIS_IMAGE:-docker.io/redis:7-alpine}
    container_name: infisical-redis
    profiles:
      - env
    restart: unless-stopped
    # Queue/rate-limit store for Infisical. appendonly keeps pending jobs
    # across restarts; the official entrypoint chowns /data itself, so no
    # rootless uid mapping is needed here.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/infisical/redis:/data
    networks:
      - env-net
    # NO ports: internal-only, reachable only by infisical on env-net

  infisical-db-dump:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: infisical-db-dump
    profiles:
      - env
    restart: unless-stopped
    # Same reasoning as infisical; the dump script probes with pg_isready and
    # skips the run when the database is not reachable yet.
    depends_on:
      - infisical-postgres
    command: ["/bin/sh", "/usr/local/bin/pg-dump.sh"]
    environment:
      - TZ=${TZ:-UTC}
      - PGHOST=infisical-postgres
      - PGPORT=5432
      - PGUSER=infisical
      - PGPASSWORD=${INFISICAL_DB_PASSWORD}
      - PGDATABASE=infisical
      # Single-database mode. The shared pg-dump.sh keeps the mattermost-dump
      # filename convention, so dumps land as infisical-<ts>.dump plus
      # infisical-latest.dump.
      - DB_DUMP_ALL=false
      - DB_DUMP_PREFIX=infisical
      - DB_DUMP_HOUR=${INFISICAL_DB_DUMP_HOUR:-2}
      - DB_DUMP_MINUTE=${INFISICAL_DB_DUMP_MINUTE:-15}
      - DB_DUMP_KEEP_DAYS=${INFISICAL_DB_DUMP_KEEP_DAYS:-14}
    volumes:
      - ./backup/pg-dump.sh:/usr/local/bin/pg-dump.sh:ro
      - ./data/infisical/db-dumps:/dumps
    networks:
      - env-net

  # --- Private tier (Tailscale only) -----------------------------------------
  # Application database for first-party backends. SECURITY.md Tier B: reachable
  # over Tailscale and from appdb-net, never from the LAN and never through
  # Cloudflare. Deliberately separate from mattermost-postgres so the chat
  # profile, its Postgres major version, and its restore blast radius stay
  # independent of application data.
  appdb:
    image: ${APPDB_IMAGE:-docker.io/postgres:17-alpine}
    container_name: appdb
    profiles:
      - db
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - POSTGRES_USER=${APPDB_SUPERUSER:-postgres}
      - POSTGRES_PASSWORD=${APPDB_SUPERUSER_PASSWORD}
      - POSTGRES_DB=postgres
      # Read by db/initdb/10-appdb-seed.sh, which the entrypoint runs only when
      # the data directory is empty.
      - APPDB_APP_USER=${APPDB_APP_USER}
      - APPDB_APP_PASSWORD=${APPDB_APP_PASSWORD}
      - APPDB_DATABASES=${APPDB_DATABASES}
    volumes:
      - ./data/appdb/postgres:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # An empty TAILSCALE_IP would render ":5432:5432", which Podman reads as
      # every interface -- putting the database on the LAN. The required-variable
      # form turns that into a hard failure. install.sh checks the same thing
      # earlier with a friendlier message, and CI tests that this still fails.
      - "${TAILSCALE_IP:?TAILSCALE_IP is empty. The db profile is Tailscale-only (SECURITY.md Tier B). Set TAILSCALE_ENABLED=true and run ./install.sh}:${APPDB_PORT:-5432}:5432"
    # Kept for `podman ps` visibility and manual `podman healthcheck run` only;
    # deliberately not used to gate startup ordering - see mattermost above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APPDB_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appdb-net

  appdb-adminer:
    image: ${ADMINER_IMAGE:-docker.io/library/adminer:latest}
    container_name: appdb-adminer
    profiles:
      - db
    restart: unless-stopped
    # Plain ordering, not condition: service_healthy - see mattermost above.
    depends_on:
      - appdb
    environment:
      - TZ=${TZ:-UTC}
      - ADMINER_DEFAULT_SERVER=appdb
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is empty. The db profile is Tailscale-only (SECURITY.md Tier B). Set TAILSCALE_ENABLED=true and run ./install.sh}:${ADMINER_PORT:-8081}:8080"
    networks:
      - appdb-net

  appdb-dump:
    image: ${APPDB_IMAGE:-docker.io/postgres:17-alpine}
    container_name: appdb-dump
    profiles:
      - db
    restart: unless-stopped
    # Plain ordering; pg-dump.sh probes with pg_isready and skips a run when the
    # database is not reachable yet.
    depends_on:
      - appdb
    command: ["/bin/sh", "/usr/local/bin/pg-dump.sh"]
    environment:
      - TZ=${TZ:-UTC}
      - PGHOST=appdb
      - PGPORT=5432
      - PGUSER=${APPDB_SUPERUSER:-postgres}
      - PGPASSWORD=${APPDB_SUPERUSER_PASSWORD}
      - PGDATABASE=postgres
      # Every application database plus the role/password globals, because this
      # server hosts an unknown number of databases.
      - DB_DUMP_ALL=true
      - DB_DUMP_HOUR=${APPDB_DUMP_HOUR:-2}
      - DB_DUMP_MINUTE=${APPDB_DUMP_MINUTE:-30}
      - DB_DUMP_KEEP_DAYS=${APPDB_DUMP_KEEP_DAYS:-14}
    volumes:
      - ./backup/pg-dump.sh:/usr/local/bin/pg-dump.sh:ro
      - ./data/appdb/db-dumps:/dumps
    networks:
      - appdb-net

  # --- Private tier (Tailscale only) -----------------------------------------
  # Umami privacy-first web analytics. Same Tier B rule as the env and db
  # profiles: reachable over Tailscale and umami-net only, never from the LAN
  # and never through Cloudflare. The app itself is stateless (no volume) --
  # all state lives in umami-postgres, per the per-feature stateful convention.
  umami:
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:latest}
    container_name: umami
    profiles:
      - analytics
    restart: unless-stopped
    # Plain ordering, not condition: service_healthy - see mattermost above.
    depends_on:
      - umami-postgres
    # Gate startup on the database accepting TCP before handing off to the
    # image's own start script (its CMD). Umami hard-exits when PostgreSQL
    # is not ready - it has no internal retry, unlike Mattermost - and a
    # first-start crash-loop is worse here than anywhere else in the stack:
    # on rootless Podman 4.9.x, a container that exits within seconds of
    # creation can leave conmon's restart supervision dead and the
    # rootlessport publish proxy never (re)spawned, so the container later
    # shows "Ready" in its logs while the host port silently does not listen
    # (observed in production: umami-postgres spent ~9 minutes in its
    # one-time initdb while umami crashed beside it; fix was recreating the
    # container - see deployment.md section 16). nc is busybox, present in
    # the alpine base of the image. The postgres image's init phase listens
    # on the unix socket only, so a successful TCP connect means the final
    # server is up.
    command:
      - /bin/sh
      - -c
      - >-
        until nc -z umami-postgres 5432; do
        echo "waiting for umami-postgres:5432"; sleep 2;
        done;
        exec sh scripts/start-docker.sh
    init: true
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-postgres:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
      # Encrypts the TOTP secrets behind two-factor login. Losing it locks out
      # every account with 2FA enabled, so it belongs with the other secrets
      # in the password manager, not on the backup disk.
      - TWO_FACTOR_ENCRYPTION_KEY=${UMAMI_2FA_KEY}
      # The stack's privacy posture is the point; umami-net is internal anyway,
      # so this just documents intent and saves a doomed request.
      - DISABLE_TELEMETRY=1
    ports:
      # Tier B (Private): reachable only through Tailscale. Loopback fallback
      # keeps an empty TAILSCALE_IP from degrading into a 0.0.0.0 bind;
      # install.sh fails closed when the analytics profile is enabled without
      # TAILSCALE_ENABLED=true. 3002, not umami's native 3000: Gitea's dev
      # port is 127.0.0.1:3000 (compose.dev.yml), and the loopback fallback
      # would collide with it on a dev machine.
      - "${TAILSCALE_IP:-127.0.0.1}:${UMAMI_PORT:-3002}:3000"
    # Kept for `podman ps` visibility and manual `podman healthcheck run` only;
    # deliberately not used to gate startup ordering - see mattermost above.
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umami-net
    # Deliberately NOT on edge-net: the tunnel must have no route to the
    # analytics UI or its collect endpoint. See SECURITY.md Tier B.

  umami-postgres:
    # Per-feature stateful instance (mattermost-postgres pattern): never
    # shared with another service, pinned via POSTGRES_IMAGE like the other
    # per-feature databases.
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: umami-postgres
    profiles:
      - analytics
    restart: unless-stopped
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - ./data/umami/postgres:/var/lib/postgresql/data
    # Kept for `podman ps` visibility and manual `podman healthcheck run`,
    # deliberately not used to gate startup ordering - see mattermost above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umami-net
    # NO ports: ever - the analytics database is internal-only, never exposed

  umami-db-dump:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: umami-db-dump
    profiles:
      - analytics
    restart: unless-stopped
    # Same reasoning as umami; the dump script probes with pg_isready and
    # skips the run when the database is not reachable yet.
    depends_on:
      - umami-postgres
    command: ["/bin/sh", "/usr/local/bin/pg-dump.sh"]
    environment:
      - TZ=${TZ:-UTC}
      - PGHOST=umami-postgres
      - PGPORT=5432
      - PGUSER=umami
      - PGPASSWORD=${UMAMI_DB_PASSWORD}
      - PGDATABASE=umami
      # Single-database mode, shared pg-dump.sh: dumps land as
      # umami-<ts>.dump plus umami-latest.dump. Runs at 02:00 - second in the
      # nightly sequence (glitchtip 01:45, infisical 02:15, appdb 02:30,
      # mattermost 02:45, restic 03:00).
      - DB_DUMP_ALL=false
      - DB_DUMP_PREFIX=umami
      - DB_DUMP_HOUR=${UMAMI_DB_DUMP_HOUR:-2}
      - DB_DUMP_MINUTE=${UMAMI_DB_DUMP_MINUTE:-0}
      - DB_DUMP_KEEP_DAYS=${UMAMI_DB_DUMP_KEEP_DAYS:-14}
    volumes:
      - ./backup/pg-dump.sh:/usr/local/bin/pg-dump.sh:ro
      - ./data/umami/db-dumps:/dumps
    networks:
      - umami-net

  # --- Private tier (Tailscale only) -----------------------------------------
  # GlitchTip application-error monitoring (Sentry-compatible). Same Tier B rule
  # as the env, db, and analytics profiles: reachable over Tailscale and
  # glitchtip-net only, never from the LAN and never through Cloudflare. That
  # also applies to the ingest endpoints (the DSN and OTLP paths): only tailnet
  # devices and first-party containers can report events - the right fit for
  # monitoring your own apps.
  glitchtip:
    image: ${GLITCHTIP_IMAGE:-docker.io/glitchtip/glitchtip:6}
    container_name: glitchtip
    profiles:
      - monitoring
    restart: unless-stopped
    # Plain ordering, not condition: service_healthy - see mattermost above.
    depends_on:
      - glitchtip-postgres
      - glitchtip-valkey
    # Gate startup on the database and queue store accepting TCP before handing
    # off to the image's start script. The image's all_in_one role begins with
    # `manage.py migrate`, which hard-exits when PostgreSQL is not ready (no
    # internal retry), and a first-start crash-loop on rootless Podman can wedge
    # conmon's restart supervision so the rootlessport publish proxy never
    # spawns - the container later looks Ready while the host port silently does
    # not listen (see deployment.md section 16). The image ships no nc/curl, so
    # the probe is python3. exec keeps the real server a direct child.
    command:
      - /bin/sh
      - -c
      - >-
        until python3 -c "import socket; socket.create_connection(('glitchtip-postgres', 5432), 3)" 2>/dev/null; do
        echo "waiting for glitchtip-postgres:5432"; sleep 2;
        done;
        until python3 -c "import socket; socket.create_connection(('glitchtip-valkey', 6379), 3)" 2>/dev/null; do
        echo "waiting for glitchtip-valkey:6379"; sleep 2;
        done;
        exec ./bin/start.sh
    init: true
    environment:
      - TZ=${TZ:-UTC}
      # Upstream's single-container role: web server with the background worker
      # embedded. The stack favors low idle resource use, and a homelab does not
      # need the separate-worker scaling shape.
      - SERVER_ROLE=all_in_one
      - DATABASE_URL=postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/glitchtip
      - VALKEY_URL=redis://glitchtip-valkey:6379/0
      # Signs Django sessions and password-reset tokens. Same class of secret
      # as N8N_ENCRYPTION_KEY: keep it off the backup disk.
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY}
      # Absolute URLs (DSN links, invite emails) build from this. The default is
      # a placeholder; set it to http://<tailscale-ip>:8082 in .env, or the
      # https://...ts.net address when fronted by `tailscale serve`.
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8080}
      # Email defaults to the container log; set an smtp:// URL to send alert
      # mail (see deployment.md section 17).
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@localhost}
      # Fail-closed signup: with false, the FIRST user can still register (the
      # signup page stays open while the user table is empty) and registration
      # closes afterwards. New users then come from a superuser or invites.
      - ENABLE_USER_REGISTRATION=${GLITCHTIP_ENABLE_USER_REGISTRATION:-false}
      # Needed only when serving from a different origin (e.g. tailscale serve
      # https); empty keeps Django's default behavior for direct tailnet access.
      - CSRF_TRUSTED_ORIGINS=${GLITCHTIP_CSRF_TRUSTED_ORIGINS:-}
    ports:
      # Tier B (Private): reachable only through Tailscale. Loopback fallback
      # keeps an empty TAILSCALE_IP from degrading into a 0.0.0.0 bind;
      # install.sh fails closed when the monitoring profile is enabled without
      # TAILSCALE_ENABLED=true. 8082 continues the Tier B port row (8080
      # Infisical, 8081 Adminer); the container-internal port stays 8000.
      - "${TAILSCALE_IP:-127.0.0.1}:${GLITCHTIP_PORT:-8082}:8000"
    # Kept for `podman ps` visibility and manual `podman healthcheck run` only;
    # deliberately not used to gate startup ordering - see mattermost above.
    # python3, because the image ships no curl.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/glitchtip/uploads:/code/uploads
    networks:
      - glitchtip-net
    # Deliberately NOT on edge-net: the tunnel must have no route to the
    # monitoring UI or its event-ingest endpoints. See SECURITY.md Tier B.

  glitchtip-postgres:
    # Per-feature stateful instance (mattermost-postgres pattern): never shared
    # with another service, pinned via POSTGRES_IMAGE like the other per-feature
    # databases.
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: glitchtip-postgres
    profiles:
      - monitoring
    restart: unless-stopped
    environment:
      - POSTGRES_USER=glitchtip
      - POSTGRES_PASSWORD=${GLITCHTIP_DB_PASSWORD}
      - POSTGRES_DB=glitchtip
    volumes:
      - ./data/glitchtip/postgres:/var/lib/postgresql/data
    # Kept for `podman ps` visibility and manual `podman healthcheck run`,
    # deliberately not used to gate startup ordering - see mattermost above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glitchtip-net
    # NO ports: ever - the monitoring database is internal-only, never exposed

  glitchtip-valkey:
    # Queue/cache store for GlitchTip. Upstream recommends Valkey (the
    # open-source Redis fork); it speaks the same protocol, and its official
    # entrypoint chowns /data itself, so no rootless uid mapping is needed -
    # the same properties that made infisical-redis a plain bind.
    image: ${GLITCHTIP_VALKEY_IMAGE:-docker.io/valkey/valkey:9-alpine}
    container_name: glitchtip-valkey
    profiles:
      - monitoring
    restart: unless-stopped
    # appendonly keeps pending tasks across restarts; sessions survive too.
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - ./data/glitchtip/valkey:/data
    networks:
      - glitchtip-net
    # NO ports: internal-only, reachable only by glitchtip on glitchtip-net

  glitchtip-db-dump:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:15-alpine}
    container_name: glitchtip-db-dump
    profiles:
      - monitoring
    restart: unless-stopped
    # Same reasoning as glitchtip; the dump script probes with pg_isready and
    # skips the run when the database is not reachable yet.
    depends_on:
      - glitchtip-postgres
    command: ["/bin/sh", "/usr/local/bin/pg-dump.sh"]
    environment:
      - TZ=${TZ:-UTC}
      - PGHOST=glitchtip-postgres
      - PGPORT=5432
      - PGUSER=glitchtip
      - PGPASSWORD=${GLITCHTIP_DB_PASSWORD}
      - PGDATABASE=glitchtip
      # Single-database mode, shared pg-dump.sh: dumps land as
      # glitchtip-<ts>.dump plus glitchtip-latest.dump. Runs at 01:45 - first
      # in the nightly sequence (umami 02:00, infisical 02:15, appdb 02:30,
      # mattermost 02:45, restic 03:00).
      - DB_DUMP_ALL=false
      - DB_DUMP_PREFIX=glitchtip
      - DB_DUMP_HOUR=${GLITCHTIP_DB_DUMP_HOUR:-1}
      - DB_DUMP_MINUTE=${GLITCHTIP_DB_DUMP_MINUTE:-45}
      - DB_DUMP_KEEP_DAYS=${GLITCHTIP_DB_DUMP_KEEP_DAYS:-14}
    volumes:
      - ./backup/pg-dump.sh:/usr/local/bin/pg-dump.sh:ro
      - ./data/glitchtip/db-dumps:/dumps
    networks:
      - glitchtip-net

  backup:
    build: ./backup
    container_name: backup
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - BACKUP_REQUIRE_MOUNT=${BACKUP_REQUIRE_MOUNT:-false}
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-/backup/restic-repo}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_HOST=${RESTIC_HOST:-localcloud}
      - RESTIC_KEEP_DAILY=${RESTIC_KEEP_DAILY:-14}
      - RESTIC_KEEP_WEEKLY=${RESTIC_KEEP_WEEKLY:-8}
      - RESTIC_KEEP_MONTHLY=${RESTIC_KEEP_MONTHLY:-6}
    volumes:
      - ${BACKUP_DEST_PATH}:/backup
      - ./data/portainer:/sources/portainer:ro
      - ./data/monitor:/sources/monitor:ro
      - ./data/gitea:/sources/gitea:ro
      - ./data/n8n:/sources/n8n:ro
      - ./data/adguard:/sources/adguard:ro
      - ./data/mattermost:/sources/mattermost:ro
      - ./data/infisical:/sources/infisical:ro
      - ./data/appdb:/sources/appdb:ro
      - ./data/umami:/sources/umami:ro
      - ./data/glitchtip:/sources/glitchtip:ro
      # Mount future service data volumes read-only under /sources/<service>
      # e.g. - ./data/<service>:/sources/<service>:ro
    network_mode: none

networks:
  # Same private-tier rule as appdb-net, env-net, and umami-net: no egress, the
  # host still reaches the published tailscale0 port. GlitchTip, its
  # PostgreSQL, and its Valkey never leave this network.
  glitchtip-net:
    driver: bridge
    internal: true
  edge-net:
    driver: bridge
  mgmt-net:
    driver: bridge
  db-net:
    driver: bridge
    internal: true
  dns-net:
    driver: bridge
  # Private tier. internal: true removes egress; the host still reaches in
  # through the published tailscale0 port (verified on rootless Podman 5.8.3
  # with netavark). Future first-party backends join this network and reach the
  # database at appdb:5432 rather than through the published port.
  appdb-net:
    driver: bridge
    internal: true
  env-net:
    # Same private-tier rule as appdb-net: no egress, host still reaches the
    # published tailscale0 port. The env store's own PostgreSQL never leaves
    # this network.
    driver: bridge
    internal: true
  # Same private-tier rule as appdb-net and env-net: no egress, host still
  # reaches the published tailscale0 port. Umami and its PostgreSQL never
  # leave this network.
  umami-net:
    driver: bridge
    internal: true
